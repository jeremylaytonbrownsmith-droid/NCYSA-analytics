name: NCYSA Find My Club refresh

# Phase A: read-only reconciliation. Run it by hand from the Actions tab
# (workflow_dispatch). The scheduled run is here but commented out until the
# numbers check out and we wire up publishing.
on:
  workflow_dispatch:
    inputs:
      range_end:
        description: "End date (YYYY-MM-DD). Use 2026-07-20 to match the July baseline."
        required: false
        default: "2026-07-20"
  # schedule:
  #   - cron: "0 11 2 8 *"   # example: Aug 2, 07:00 ET (11:00 UTC)

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service-account key from secret
        run: |
          printf '%s' "${GA4_SA_KEY}" > key.json
          python -c "import json;json.load(open('key.json'));print('key.json is valid JSON')"
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}

      - name: Pull GA4 data and reconcile
        run: python ga_pull.py
        env:
          GA4_KEY_FILE: key.json
          GA4_PROPERTY_ID: "514757424"
          RANGE_START: "2026-01-01"
          RANGE_END: ${{ github.event.inputs.range_end }}

      - name: Clean up key
        if: always()
        run: rm -f key.json

      - name: Upload raw numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga_results
          path: ga_results.json
