name: NCYSA Find My Club refresh

# Phase A: read-only reconciliation, always runs. Phase B: build the report
# and publish it to the WordPress DRAFT/preview page ONLY -- opt-in via the
# publish_preview input, never on by default. Nothing in this workflow ever
# writes to the live board page. The scheduled run is still commented out
# until Step 4 (recurring auto-refresh) is explicitly approved.
on:
  workflow_dispatch:
    inputs:
      range_end:
        description: "End date (YYYY-MM-DD). Use 2026-07-20 to match the July baseline."
        required: false
        default: "2026-07-20"
      publish_preview:
        description: "Also build the report and publish it to the WP preview/draft page (never the live page)"
        type: boolean
        required: false
        default: false
  # schedule:
  #   - cron: "0 11 2 8 *"   # example: Aug 2, 07:00 ET (11:00 UTC)

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service-account key from secret
        run: |
          printf '%s' "${GA4_SA_KEY}" > key.json
          python -c "import json;json.load(open('key.json'));print('key.json is valid JSON')"
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}

      - name: Pull GA4 data and reconcile
        run: python ga_pull.py
        env:
          GA4_KEY_FILE: key.json
          GA4_PROPERTY_ID: "514757424"
          RANGE_START: "2026-01-01"
          RANGE_END: ${{ github.event.inputs.range_end }}

      - name: Pull full report data
        if: github.event.inputs.publish_preview == 'true'
        run: python build_data.py
        env:
          GA4_KEY_FILE: key.json
          GA4_PROPERTY_ID: "514757424"
          RANGE_START: "2026-01-01"
          RANGE_END: ${{ github.event.inputs.range_end }}

      - name: Clean up key
        if: always()
        run: rm -f key.json

      - name: Build report HTML
        if: github.event.inputs.publish_preview == 'true'
        run: python build_report.py

      - name: Publish to WP preview/draft (never the live page)
        if: github.event.inputs.publish_preview == 'true'
        run: python publish.py
        env:
          WP_SITE: "https://www.ncsoccer.org"
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_LIVE_PAGE_ID: "10514"
          WP_PREVIEW_SLUG: "board-meeting-8-5-preview"

      - name: Upload raw numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga_results
          path: ga_results.json

      - name: Upload rebuilt report
        if: github.event.inputs.publish_preview == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: board_report
          path: build/board_report.html
