name: NCYSA Find My Club refresh

# Always runs: read-only GA4 reconciliation (ga_pull.py).
#
# Full chain (data -> guardrail -> Word/Excel rebuild -> media upload ->
# HTML rebuild -> WordPress publish) runs when either:
#   - triggered manually with the "publish_preview" checkbox on, or
#   - triggered by the weekly schedule below.
#
# The publish target (preview draft vs. the live page) is computed by the
# "Determine publish target" step. Manual runs choose it via the
# publish_target input (default preview). Scheduled runs always use
# SCHEDULED_PUBLISH_TARGET below -- currently "live". That one line is
# the switch; set it back to "preview" to pull hands-off publishing back
# to the draft page.
#
# To pause the live page without touching this file at all, prepend
# "[PAUSED]" to the live page's title in WordPress -- see is_paused() in
# publish.py. That works from any branch/target and needs no code access.
#
# Note: GitHub Actions only fires `schedule` triggers from the repository's
# default branch. This branch (claude/ncysa-ga4-refresh-automation-sxdq6r)
# is currently the repo's default branch, so the schedule is live from here.
on:
  workflow_dispatch:
    inputs:
      range_end:
        description: "End date (YYYY-MM-DD). Use 2026-07-20 to match the July baseline."
        required: false
        default: "2026-07-20"
      publish_preview:
        description: "Also run the full chain: rebuild Word/Excel/HTML and publish (see publish_target)"
        type: boolean
        required: false
        default: false
      publish_target:
        description: "Where to publish when publish_preview is checked"
        type: choice
        options:
          - preview
          - live
        required: false
        default: preview
  schedule:
    # Monday/Wednesday/Friday, 8:00 AM US-Eastern. Cron is UTC-only and
    # doesn't shift for DST: 12:00 UTC is 8am EDT (roughly Mar-Nov); during
    # EST (winter) this fires at 7am ET instead. Adjust to "0 13 * * 1,3,5"
    # for wintertime 8am ET if that precision starts to matter.
    - cron: "0 12 * * 1,3,5"
    # One-off safety net: Aug 4 evening (6pm ET / 22:00 UTC), the evening
    # before the Aug 5 board meeting, in case that week's regular cadence
    # above ever misses or the meeting date needs a guaranteed same-day
    # refresh. Harmless to leave in place after the meeting -- it'll just
    # fire again on Aug 4 next year too; delete this line whenever that
    # stops being useful.
    - cron: "0 22 4 8 *"

env:
  # The one-line switch: change to "live" when ready for the weekly
  # schedule to publish straight to the live page instead of the draft.
  SCHEDULED_PUBLISH_TARGET: live

permissions:
  contents: write  # needed to commit the updated guardrail baseline

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine whether to run the full chain and where to publish
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run_chain=true" >> "$GITHUB_OUTPUT"
            echo "target=${{ env.SCHEDULED_PUBLISH_TARGET }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_chain=${{ github.event.inputs.publish_preview }}" >> "$GITHUB_OUTPUT"
            echo "target=${{ github.event.inputs.publish_target }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write service-account key from secret
        run: |
          printf '%s' "${GA4_SA_KEY}" > key.json
          python -c "import json;json.load(open('key.json'));print('key.json is valid JSON')"
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}

      - name: Pull GA4 data and reconcile
        run: python ga_pull.py
        env:
          GA4_KEY_FILE: key.json
          GA4_PROPERTY_ID: "514757424"
          RANGE_START: "2026-01-01"
          RANGE_END: ${{ github.event.inputs.range_end }}

      - name: Pull full report data
        if: success() && steps.plan.outputs.run_chain == 'true'
        run: python build_data.py
        env:
          GA4_KEY_FILE: key.json
          GA4_PROPERTY_ID: "514757424"
          RANGE_START: "2026-01-01"
          RANGE_END: ${{ github.event.inputs.range_end }}

      - name: Clean up key
        if: always()
        run: rm -f key.json

      - name: Guardrail -- abort if core numbers are zero/missing or swung >60%
        if: success() && steps.plan.outputs.run_chain == 'true'
        run: python guardrail.py

      - name: Commit updated guardrail baseline
        if: success() && steps.plan.outputs.run_chain == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "Update guardrail baseline [skip ci]"
            git push
          fi

      - name: Build Word report
        if: success() && steps.plan.outputs.run_chain == 'true'
        run: python generate_docx.py

      - name: Build Excel workbook
        if: success() && steps.plan.outputs.run_chain == 'true'
        run: python generate_xlsx.py

      - name: Upload Word/Excel to WordPress media library
        if: success() && steps.plan.outputs.run_chain == 'true'
        run: python publish.py media
        env:
          WP_SITE: "https://www.ncsoccer.org"
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

      - name: Build report HTML
        if: success() && steps.plan.outputs.run_chain == 'true'
        run: python build_report.py

      - name: Publish HTML to WordPress
        if: success() && steps.plan.outputs.run_chain == 'true'
        run: python publish.py page
        env:
          WP_SITE: "https://www.ncsoccer.org"
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_LIVE_PAGE_ID: "10514"
          WP_PREVIEW_SLUG: "board-meeting-8-5-preview"
          PUBLISH_TARGET: ${{ steps.plan.outputs.target }}

      - name: Upload raw numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga_results
          path: ga_results.json

      - name: Upload rebuilt report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board_report_bundle
          path: |
            build/board_report.html
            build/board_report.docx
            build/data_workbook.xlsx
          if-no-files-found: ignore
